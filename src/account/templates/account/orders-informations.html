{% extends 'ecommerce/base.html' %}
{% block title %}Track Orders{% endblock %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'account/style_track-orders.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<div class="container_parent">
    <div class="container_child">
        <a id="back-link" href="{% url 'track-orders' %}"><i class="fa fa-long-arrow-left" aria-hidden="true"></i> Back</a>
        {% for order in orders %}
        <br>
            <br>
            <hr>
            <br>
            <h4>Product : {{order.product}}</h4>
            <h4>Qty : {{order.quantity}}</h4>
            <h4>Price (Just the product) : {{order.price}}$</h4>
            <br>
        {% endfor %}
    </div>
</div>
{% endblock %}
