{% extends 'ecommerce/base.html' %}
{% block title %}Manage Shipping{% endblock %}
{% load static %}
{% block content %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{% static 'account/style_manage-shipping.css' %}">
  <div class="container_parent">
    <div class="container_child">
      <a id="back-link" href="{% url 'dashboard' %}"><i class="fa fa-long-arrow-left" aria-hidden="true"></i> Back</a>
      <br>
      <br>
      <h1><i class="fa fa-address-card" aria-hidden="true"></i> Manage shipping</h1>
      <br>
      <form method="POST">
        <div class="container_form">
        {% csrf_token %}
        {{form.as_p}}
        </div>
        <div class="container_submit_button">
          <button class="submit_button_form" type="submit"><i class="fa fa-floppy-o" aria-hidden="true"></i> Save</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
