{% extends 'ecommerce/base.html' %}

{% block content %}

<div class="container_parent">
  <div class="container_child">
    <a id="back-link" href="{% url 'profile-management' %}"><i class="fa fa-long-arrow-left" aria-hidden="true"></i> Back</a>

    <br>

    </form>
  </div>
</div>
{% endblock %}
