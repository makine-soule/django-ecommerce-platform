{% extends 'ecommerce/base.html' %}
{% block title %}Update Account{% endblock %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'account/style_update.css' %}">
<div class="container_parent">
  <div class="container_child">
    <a id="back-link" href="{% url 'profile-management' %}"><i class="fa fa-long-arrow-left" aria-hidden="true"></i> Back</a>
    <br>
    <br>
    <h1>Update your account</h1>
    <br>
    <br>
    <form method="POST">
      {% csrf_token %}
      {{form.as_p}}
      <br>
      <hr>
      <div class="button-update">
        <br>
        <button type="submit">Update</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
